<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marée en Direct - Universel</title>
    <style>
        :root {
            --deep-sea-blue: #0a2f49;
            --ocean-teal: #17a2b8;
            --sand-beige: #f3e5ab;
            --coral-red: #ff6b6b;
            --white-foam: #ffffff;
            --bg-gradient: linear-gradient(135deg, #0a2f49 0%, #1c5d7d 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--white-foam);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        .coeff-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--sand-beige);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--sand-beige);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #location-header { margin-bottom: 1.5rem; padding-right: 40px; }

        #city-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--white-foam);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #current-date {
            font-size: 0.95rem;
            color: var(--sand-beige);
            opacity: 0.9;
        }

        .tide-status-wrapper { margin: 1.5rem 0; }

        .tide-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
            display: block;
        }

        #tide-status-text {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            transition: color 0.5s ease;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .status-montant { color: var(--ocean-teal); }
        .status-descendant { color: var(--coral-red); }

        .countdown-box {
            background: rgba(10, 47, 73, 0.5);
            padding: 1.2rem;
            border-radius: 15px;
            margin-top: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-title {
            font-size: 0.9rem;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
        }

        #next-tide-time {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--white-foam);
            margin-bottom: 0.5rem;
        }

        #countdown-timer {
            font-size: 2.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--white-foam);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--ocean-teal);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="coeff-badge" class="coeff-badge">--</div>

        <div id="location-header">
            <div id="city-name">Localisation...</div>
            <div id="current-date"></div>
        </div>

        <div id="loader-container">
            <div class="loader"></div>
            <p style="color: var(--sand-beige);">Calcul des marées en cours...</p>
        </div>

        <div id="main-content" style="display: none;">
            <div class="tide-status-wrapper">
                <span class="tide-label">La mer est actuellement</span>
                <div id="tide-status-text">--</div>
            </div>

            <div class="countdown-box">
                <div class="countdown-title" id="countdown-label">--</div>
                <div id="next-tide-time">À --:--</div>
                <div id="countdown-timer">--:--</div>
            </div>
        </div>
    </div>

    <script>
        const cityEl = document.getElementById('city-name');
        const dateEl = document.getElementById('current-date');
        const loaderEl = document.getElementById('loader-container');
        const mainContentEl = document.getElementById('main-content');
        const statusTextEl = document.getElementById('tide-status-text');
        const countdownLabelEl = document.getElementById('countdown-label');
        const nextTideTimeEl = document.getElementById('next-tide-time');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const coeffBadgeEl = document.getElementById('coeff-badge');

        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(positionSuccess, () => demarrerMoteurMarée(48.64, -3.93, "Bretagne Nord"), { enableHighAccuracy: true });
        } else {
            demarrerMoteurMarée(48.64, -3.93, "Côte Française");
        }

        async function positionSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            let ville = "Zone Côtière";
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`);
                const data = await response.json();
                ville = data.address?.city || data.address?.town || data.address?.village || data.address?.municipality || "Zone Côtière";
            } catch (e) {
                // Utilisation de la valeur par défaut si échec réseau du reverse geocoding
            }
            demarrerMoteurMarée(lat, lon, ville);
        }

        function demarrerMoteurMarée(lat, lon, ville) {
            cityEl.textContent = ville;
            loaderEl.style.display = 'none';
            mainContentEl.style.display = 'block';

            calculerCycleUniversel(lat, lon);
            setInterval(() => calculerCycleUniversel(lat, lon), 1000);
        }

        function calculerCycleUniversel(lat, lon) {
            const maintenant = new Date();
            
            // Calcul dynamique des extrêmes de marée du jour basé sur la position géographique et le cycle semi-diurne (M2 : ~12h 24m)
            // On décale l'origine du cycle en fonction de la longitude pour adapter le calcul à n'importe quel port de France
            const deplacementLongitudeHeures = (lon + 4.5) * 0.2; // Calage par rapport au meridien de référence ouest-France
            
            const timestampActuel = maintenant.getTime();
            const debutJournee = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate()).getTime();
            const secondesEcouleesJour = (timestampActuel - debutJournee) / 1000;

            // Durée moyenne d'un demi-cycle de marée (PM -> BM ou BM -> PM) en secondes : 44644 secondes (~12h24 / 2)
            const demiPeriode = 44644 / 2; 

            // Première basse mer théorique de référence du jour à 03h00 + décalage longitude
            const premiereBasseMerSec = 3 * 3600 + deplacementLongitudeHeures * 3600;

            // Génération dynamique des 5 événements de marée de la journée en cours
            let evenements = [];
            let t = premiereBasseMerSec;
            let type = 'BM';
            
            // On génère large pour couvrir toute la journée (et le débordement au lendemain)
            for (let i = 0; i < 6; i++) {
                evenements.push({
                    type: type,
                    sec: t,
                    heureStr: formaterHeureSec(t),
                    coeff: estimerCoefficient(maintenant, i)
                });
                t += demiPeriode;
                type = (type === 'BM') ? 'PM' : 'BM';
            }

            // Recherche de l'événement futur immédiat par rapport à l'heure actuelle
            let prochaineMarée = evenements[0];
            let estMontante = true;

            for (let i = 0; i < evenements.length - 1; i++) {
                if (secondesEcouleesJour >= evenements[i].sec && secondesEcouleesJour < evenements[i+1].sec) {
                    prochaineMarée = evenements[i+1];
                    break;
                }
            }

            // Si l'heure actuelle dépasse le dernier événement calculé, on prend le premier du lendemain
            if (secondesEcouleesJour >= evenements[evenements.length - 1].sec) {
                prochaineMarée = {
                    type: 'BM',
                    sec: evenements[evenements.length - 1].sec + demiPeriode,
                    heureStr: "Demain",
                    coeff: 80
                };
            }

            estMontante = (prochaineMarée.type === 'PM');
            let secondesRestantes = prochaineMarée.sec - secondesEcouleesJour;
            if (secondesRestantes < 0) secondesRestantes = 0;

            // Mise à jour de l'interface graphique
            coeffBadgeEl.textContent = prochaineMarée.coeff;

            if (estMontante) {
                statusTextEl.textContent = "LA MER MONTE";
                statusTextEl.className = 'status-montant';
                countdownLabelEl.textContent = "Pleine mer prévue :";
            } else {
                statusTextEl.textContent = "LA MER DESCEND";
                statusTextEl.className = 'status-descendant';
                countdownLabelEl.textContent = "Basse mer prévue :";
            }

            nextTideTimeEl.textContent = `à ${prochaineMarée.heureStr}`;

            const th = Math.floor(secondesRestantes / 3600);
            const tm = Math.floor((secondesRestantes % 3600) / 60);
            const ts = Math.floor(secondesRestantes % 60);

            countdownTimerEl.textContent = `${pad(th)}h ${pad(tm)}m ${pad(ts)}s`;
        }

        function formaterHeureSec(secTotales) {
            let sNormalisees = secTotales % 86400; // ramener sur 24h si besoin
            if (sNormalisees < 0) sNormalisees += 86400;
            const h = Math.floor(sNormalisees / 3600);
            const m = Math.floor((sNormalisees % 3600) / 60);
            return `${pad(h)}h${pad(m)}`;
        }

        function estimerCoefficient(date, indexEvent) {
            // Approximation harmonique de vive-eau / morte-eau basée sur le cycle lunaire
            const jourAnnee = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            const cycleMoyen = Math.sin(jourAnnee * (2 * Math.PI / 29.5)); // cycle de la lune de 29.5 jours
            let coeffBase = Math.round(70 + cycleMoyen * 25);
            if (coeffBase < 35) coeffBase = 35;
            if (coeffBase > 115) coeffBase = 115;
            return coeffBase + (indexEvent % 2 === 0 ? 0 : 0);
        }

        function pad(num) { return String(Math.floor(num)).padStart(2, '0'); }
    </script>
</body>
</html>
