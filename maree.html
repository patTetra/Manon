<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marée en Direct</title>
    <style>
        :root {
            --deep-sea-blue: #0a2f49;
            --ocean-teal: #17a2b8;
            --sand-beige: #f3e5ab;
            --coral-red: #ff6b6b;
            --white-foam: #ffffff;
            --bg-gradient: linear-gradient(135deg, #0a2f49 0%, #1c5d7d 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--white-foam);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        .coeff-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--sand-beige);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--sand-beige);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #location-header { margin-bottom: 1.5rem; padding-right: 40px; }

        #city-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--white-foam);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Sélecteur de ville stylisé */
        .city-select-wrapper {
            margin-bottom: 0.5rem;
        }

        #port-selector {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--sand-beige);
            color: var(--sand-beige);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        #port-selector option {
            background: var(--deep-sea-blue);
            color: var(--white-foam);
        }

        #current-date {
            font-size: 0.95rem;
            color: var(--sand-beige);
            opacity: 0.9;
        }

        .tide-status-wrapper { margin: 1.5rem 0; }

        .tide-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
            display: block;
        }

        #tide-status-text {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            transition: color 0.5s ease;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .status-montant { color: var(--ocean-teal); }
        .status-descendant { color: var(--coral-red); }

        .countdown-box {
            background: rgba(10, 47, 73, 0.5);
            padding: 1.2rem;
            border-radius: 15px;
            margin-top: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-title {
            font-size: 0.9rem;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
        }

        #next-tide-time {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--white-foam);
            margin-bottom: 0.5rem;
        }

        #countdown-timer {
            font-size: 2.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--white-foam);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--ocean-teal);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="coeff-badge" class="coeff-badge">--</div>

        <div id="location-header">
            <div id="city-name">Roscoff</div>
            <div class="city-select-wrapper">
                <select id="port-selector" onchange="changerDePort(this.value)">
                    <option value="roscoff" selected>Changer de port...</option>
                    <option value="roscoff">Roscoff</option>
                    <option value="st-malo">Saint-Malo</option>
                    <option value="brest">Brest</option>
                    <option value="cherbourg">Cherbourg</option>
                </select>
            </div>
            <div id="current-date"></div>
        </div>

        <div id="loader-container" style="display: none;">
            <div class="loader"></div>
            <p style="color: var(--sand-beige);">Mise à jour...</p>
        </div>

        <div id="main-content">
            <div class="tide-status-wrapper">
                <span class="tide-label">La mer est actuellement</span>
                <div id="tide-status-text">--</div>
            </div>

            <div class="countdown-box">
                <div class="countdown-title" id="countdown-label">--</div>
                <div id="next-tide-time">À --:--</div>
                <div id="countdown-timer">--:--</div>
            </div>
        </div>
    </div>

    <script>
        const cityEl = document.getElementById('city-name');
        const dateEl = document.getElementById('current-date');
        const statusTextEl = document.getElementById('tide-status-text');
        const countdownLabelEl = document.getElementById('countdown-label');
        const nextTideTimeEl = document.getElementById('next-tide-time');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const coeffBadgeEl = document.getElementById('coeff-badge');
        const portSelector = document.getElementById('port-selector');

        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Base de données par port (avec les horaires exacts du jour par exemple)
        const BasesPorts = {
            "roscoff": {
                nom: "Roscoff",
                marees: [
                    { type: 'BM', h: 3, m: 31, coeff: 95 },
                    { type: 'PM', h: 9, m: 25, coeff: 95 },
                    { type: 'BM', h: 15, m: 45, coeff: 90 },
                    { type: 'PM', h: 21, m: 35, coeff: 90 }
                ]
            },
            "st-malo": {
                nom: "Saint-Malo",
                marees: [
                    { type: 'BM', h: 4, m: 5, coeff: 96 },
                    { type: 'PM', h: 9, m: 58, coeff: 96 },
                    { type: 'BM', h: 16, m: 20, coeff: 91 },
                    { type: 'PM', h: 22, m: 10, coeff: 91 }
                ]
            },
            "brest": {
                nom: "Brest",
                marees: [
                    { type: 'BM', h: 3, m: 45, coeff: 94 },
                    { type: 'PM', h: 9, m: 38, coeff: 94 },
                    { type: 'BM', h: 16, m: 0, coeff: 89 },
                    { type: 'PM', h: 21, m: 50, coeff: 89 }
                ]
            },
            "cherbourg": {
                nom: "Cherbourg",
                marees: [
                    { type: 'BM', h: 5, m: 10, coeff: 85 },
                    { type: 'PM', h: 11, m: 15, coeff: 85 },
                    { type: 'BM', h: 17, m: 30, coeff: 80 },
                    { type: 'PM', h: 23, m: 25, coeff: 80 }
                ]
            }
        };

        let portActuel = "roscoff";

        function changerDePort(valeur) {
            if (BasesPorts[valeur]) {
                portActuel = valeur;
                cityEl.textContent = BasesPorts[valeur].nom;
                calculerMareeTempsReel();
            }
        }

        function calculerMareeTempsReel() {
            const dateActuelle = new Date();
            const mareesDuJour = BasesPorts[portActuel].marees;
            const secondesActuelles = dateActuelle.getHours() * 3600 + dateActuelle.getMinutes() * 60 + dateActuelle.getSeconds();

            let prochaine = null;
            let estMontante = false;

            for (let i = 0; i < mareesDuJour.length; i++) {
                const eventSec = mareesDuJour[i].h * 3600 + mareesDuJour[i].m * 60;
                if (secondesActuelles < eventSec) {
                    prochaine = mareesDuJour[i];
                    prochaine.eventSec = eventSec;
                    break;
                }
            }

            // Si la dernière marée de la journée est passée, on prend la première du lendemain
            if (!prochaine) {
                prochaine = { type: 'BM', h: 4, m: 0, coeff: 85, eventSec: 24 * 3600 + 4 * 3600 };
            }

            estMontante = (prochaine.type === 'PM');
            let secondesRestantes = prochaine.eventSec - secondesActuelles;
            if (secondesRestantes < 0) secondesRestantes = 0;

            // Mise à jour visuelle
            coeffBadgeEl.textContent = prochaine.coeff;

            if (estMontante) {
                statusTextEl.textContent = "LA MER MONTE";
                statusTextEl.className = 'status-montant';
                countdownLabelEl.textContent = "Pleine mer prévue :";
            } else {
                statusTextEl.textContent = "LA MER DESCEND";
                statusTextEl.className = 'status-descendant';
                countdownLabelEl.textContent = "Basse mer prévue :";
            }

            const heureFormatee = `${pad(prochaine.h)}h${pad(prochaine.m)}`;
            nextTideTimeEl.textContent = `à ${heureFormatee}`;

            const th = Math.floor(secondesRestantes / 3600);
            const tm = Math.floor((secondesRestantes % 3600) / 60);
            const ts = secondesRestantes % 60;

            countdownTimerEl.textContent = `${pad(th)}h ${pad(tm)}m ${pad(ts)}s`;
        }

        // Lancement initial et rafraîchissement chaque seconde
        calculerMareeTempsReel();
        setInterval(calculerMareeTempsReel, 1000);

        function pad(num) { return String(num).padStart(2, '0'); }
    </script>
</body>
</html>
