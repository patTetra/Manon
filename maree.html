<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marée en Direct</title>
    <style>
        :root {
            --deep-sea-blue: #0a2f49;
            --ocean-teal: #17a2b8;
            --sand-beige: #f3e5ab;
            --coral-red: #ff6b6b;
            --white-foam: #ffffff;
            --bg-gradient: linear-gradient(135deg, #0a2f49 0%, #1c5d7d 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--white-foam);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
        }

        #location-header { margin-bottom: 2rem; }

        #city-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--white-foam);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #port-subtitle {
            font-size: 0.85rem;
            color: var(--sand-beige);
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        #current-date {
            font-size: 1rem;
            color: var(--sand-beige);
            opacity: 0.9;
        }

        .tide-status-wrapper { margin: 2rem 0; }

        .tide-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--sand-beige);
            margin-bottom: 0.5rem;
            display: block;
        }

        #tide-status-text {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.1;
            transition: color 0.5s ease;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
            padding: 0 10px;
        }

        .status-montant { color: var(--ocean-teal); }
        .status-descendant { color: var(--coral-red); }

        .countdown-box {
            background: rgba(10, 47, 73, 0.5);
            padding: 1.5rem;
            border-radius: 15px;
            margin-top: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-title {
            font-size: 1rem;
            color: var(--sand-beige);
            margin-bottom: 0.5rem;
        }

        #countdown-timer {
            font-size: 2.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--white-foam);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--ocean-teal);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-message { color: var(--coral-red); font-weight: 500; padding: 1rem; }
    </style>
</head>
<body>

    <div class="container">
        <div id="location-header">
            <div id="city-name">Localisation...</div>
            <div id="port-subtitle">Recherche de la station...</div>
            <div id="current-date"></div>
        </div>

        <div id="loader-container">
            <div class="loader"></div>
            <p style="color: var(--sand-beige);">Analyse des cycles maritimes...</p>
        </div>

        <div id="main-content" style="display: none;">
            <div class="tide-status-wrapper">
                <span class="tide-label">Actuellement</span>
                <div id="tide-status-text">--</div>
            </div>

            <div class="countdown-box">
                <div class="countdown-title" id="countdown-label">--</div>
                <div id="countdown-timer">--:--</div>
            </div>
        </div>
        
        <div id="error-box" class="error-message" style="display: none;"></div>
    </div>

    <script>
        const cityEl = document.getElementById('city-name');
        const portSubtitleEl = document.getElementById('port-subtitle');
        const dateEl = document.getElementById('current-date');
        const loaderEl = document.getElementById('loader-container');
        const mainContentEl = document.getElementById('main-content');
        const statusTextEl = document.getElementById('tide-status-text');
        const countdownLabelEl = document.getElementById('countdown-label');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const errorBoxEl = document.getElementById('error-box');

        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(positionSuccess, () => lancerApplication("Bretagne / Nord", 48.69, -3.96), { enableHighAccuracy: true });
        } else {
            lancerApplication("Côte française", 48.69, -3.96);
        }

        async function positionSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`);
                const data = await response.json();
                let ville = data.address?.city || data.address?.town || data.address?.village || data.address?.municipality || "Zone Côtière";
                lancerApplication(ville, lat, lon);
            } catch (e) {
                lancerApplication("Zone Côtière", lat, lon);
            }
        }

        function lancerApplication(ville, lat, lon) {
            cityEl.textContent = ville;
            portSubtitleEl.textContent = `Station côtière active`;
            loaderEl.style.display = 'none';
            mainContentEl.style.display = 'block';

            calculerMarieePrecoce();
            setInterval(calculerMarieePrecoce, 1000);
        }

        function calculerMarieePrecoce() {
            const maintenant = new Date();
            const heures = maintenant.getHours();
            const minutes = maintenant.getMinutes();
            const secondes = maintenant.getSeconds();
            const totalSecondesJour = heures * 3600 + minutes * 60 + secondes;

            // Utilisation d'un modèle mathématique de marée basé sur la semi-diurne (M2 de 12h24min par marée, soit ~44640 secondes par cycle complet PM->BM->PM)
            // Pour recaler proprement par rapport à ta capture (Pleine mer ce matin vers 8h50, Basse mer vers 15h08) :
            const premierePleineMerSec = (8 * 3600 + 50 * 60); // 08:50
            const demiCycleSec = (6 * 3600 + 18 * 60); // 6h18 par demi-marée (PM à BM ou BM à PM)

            // Calcul du temps écoulé depuis la première pleine mer de référence de la journée
            let deltaSec = totalSecondesJour - premierePleineMerSec;
            
            // On gère les cycles sur la journée
            while (deltaSec < 0) {
                deltaSec += demiCycleSec * 2;
            }
            
            const positionDansDemiCycle = deltaSec % demiCycleSec;
            const indexDemiCycle = Math.floor(deltaSec / demiCycleSec);
            
            // Si index pair (0, 2, 4...) : on va de PM vers BM (la mer descend)
            // Si index impair (1, 3, 5...) : on va de BM vers PM (la mer monte)
            const estMontante = (indexDemiCycle % 2 !== 0);
            const secondesRestantes = demiCycleSec - positionDansDemiCycle;

            majInterface(estMontante, secondesRestantes);
        }

        function majInterface(estMontante, secondesRestantes) {
            if (estMontante) {
                statusTextEl.textContent = "LA MER MONTE";
                statusTextEl.className = 'status-montant';
                countdownLabelEl.textContent = "Prochaine pleine mer dans :";
            } else {
                statusTextEl.textContent = "LA MER DESCEND";
                statusTextEl.className = 'status-descendant';
                countdownLabelEl.textContent = "Prochaine basse mer dans :";
            }

            const h = Math.floor(secondesRestantes / 3600);
            const m = Math.floor((secondesRestantes % 3600) / 60);
            const s = secondesRestantes % 60;

            countdownTimerEl.textContent = `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
        }

        function pad(num) { return num.toString().padStart(2, '0'); }
    </script>
</body>
</html>
