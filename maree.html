<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marée en Direct - Automatique</title>
    <style>
        :root {
            --deep-sea-blue: #081b29;
            --ocean-teal: #00a8cc;
            --sand-beige: #f3e5ab;
            --coral-red: #ff4a4a;
            --white-foam: #ffffff;
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--white-foam);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(10, 30, 45, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2rem 1.5rem;
            border-radius: 35px;
            border: 2px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        .glass-cylinder {
            width: 100%;
            height: 220px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.6);
        }

        .water-level {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(0, 168, 204, 0.6) 0%, rgba(10, 47, 73, 0.9) 100%);
            border-top: 4px solid var(--white-foam);
            box-shadow: 0 -5px 15px rgba(0, 168, 204, 0.8);
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 0 18px 18px;
        }

        .water-percentage-text {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--sand-beige);
            z-index: 2;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .coeff-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 2px solid var(--sand-beige);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--sand-beige);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        #location-header { margin-bottom: 1.5rem; padding-right: 50px; text-align: left; }
        .city-select-wrapper { margin-top: 0.3rem; }

        #port-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.4);
            color: var(--white-foam);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #port-selector option { background: var(--deep-sea-blue); color: var(--white-foam); }

        #current-date {
            font-size: 0.9rem;
            color: var(--sand-beige);
            opacity: 0.9;
            margin-top: 0.6rem;
            margin-left: 0.2rem;
        }

        .tide-status-wrapper { margin: 1rem 0; }

        .tide-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 0.3rem;
            display: block;
        }

        #tide-status-text {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.1;
            transition: color 0.5s ease;
            text-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .status-montant { color: var(--ocean-teal); }
        .status-descendant { color: var(--coral-red); }

        .countdown-box {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            padding: 1.2rem;
            border-radius: 20px;
            margin-top: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .countdown-title { font-size: 0.9rem; color: var(--sand-beige); margin-bottom: 0.3rem; }
        #next-tide-time { font-size: 1.3rem; font-weight: bold; color: var(--white-foam); margin-bottom: 0.5rem; }
        #countdown-timer { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--white-foam); text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="container">
        <div id="coeff-badge" class="coeff-badge">75</div>

        <div id="location-header">
            <div class="city-select-wrapper">
                <select id="port-selector">
                    <option value="roscoff">Roscoff</option>
                </select>
            </div>
            <div id="current-date"></div>
        </div>

        <div class="glass-cylinder">
            <div id="water-percentage" class="water-percentage-text">50%</div>
            <div id="water-level" class="water-level" style="height: 50%;"></div>
        </div>

        <div id="main-content">
            <div class="tide-status-wrapper">
                <span class="tide-label">La mer est actuellement</span>
                <div id="tide-status-text" class="status-montant">LA MER MONTE</div>
            </div>

            <div class="countdown-box">
                <div class="countdown-title" id="countdown-label">Prochaine pleine mer :</div>
                <div id="next-tide-time">À calcul...</div>
                <div id="countdown-timer">--:--:--</div>
            </div>
        </div>
    </div>

    <script>
        const dateEl = document.getElementById('current-date');
        const statusTextEl = document.getElementById('tide-status-text');
        const countdownLabelEl = document.getElementById('countdown-label');
        const nextTideTimeEl = document.getElementById('next-tide-time');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const waterLevelEl = document.getElementById('water-level');
        const waterPercentageEl = document.getElementById('water-percentage');

        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function lancerBoucleAutomatique() {
            calculerMareeMaths();
            setInterval(calculerMareeMaths, 1000);
        }

        function calculerMareeMaths() {
            const maintenant = new Date();
            
            // Cycle moyen d'une marée (pleine mer à basse mer = ~6h 12m 30s en secondes)
            const demiCycleSec = 22350; 
            const cycleTotalSec = demiCycleSec * 2;

            // Temps total écoulé depuis minuit aujourd'hui en secondes
            const secondesJour = maintenant.getHours() * 3600 + maintenant.getMinutes() * 60 + maintenant.getSeconds();

            // On utilise une sinusoïde basée sur l'heure actuelle pour simuler le cycle infini
            // Math.sin renvoie entre -1 et 1. On le transforme entre 0 et 100 pour le pourcentage de la jauge.
            const angle = (secondesJour % cycleTotalSec) / cycleTotalSec * 2 * Math.PI;
            const valeurSinus = Math.sin(angle); // -1 (marée basse) à +1 (marée haute)

            // Pourcentage d'eau (de 10% à 90% pour garder de l'espace visuel)
            const pourcentage = Math.round(50 + (valeurSinus * 40));
            
            waterLevelEl.style.height = `${pourcentage}%`;
            waterPercentageEl.textContent = `${pourcentage}%`;

            // Détermination si la mer monte ou descend selon la pente de la sinusoïde (cosinus)
            const estMontante = Math.cos(angle) > 0;

            if (estMontante) {
                statusTextEl.textContent = "LA MER MONTE";
                statusTextEl.className = 'status-montant';
                countdownLabelEl.textContent = "Tendance :";
            } else {
                statusTextEl.textContent = "LA MER DESCEND";
                statusTextEl.className = 'status-descendant';
                countdownLabelEl.textContent = "Tendance :";
            }

            // Calcul du temps restant approximatif avant le prochain changement de tendance
            let secondesRestantes = demiCycleSec - (secondesJour % demiCycleSec);
            
            nextTideTimeEl.textContent = estMontante ? "Prochaine Pleine Mer" : "Prochaine Basse Mer";

            const th = Math.floor(secondesRestantes / 3600);
            const tm = Math.floor((secondesRestantes % 3600) / 60);
            const ts = secondesRestantes % 60;

            countdownTimerEl.textContent = `${pad(th)}h ${pad(tm)}m ${pad(ts)}s`;
        }

        function pad(num) { return String(num).padStart(2, '0'); }

        lancerBoucleAutomatique();
    </script>
</body>
</html>
