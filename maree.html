<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marée en Direct</title>
    <style>
        :root {
            --deep-sea-blue: #0a2f49;
            --ocean-teal: #17a2b8;
            --sand-beige: #f3e5ab;
            --coral-red: #ff6b6b;
            --white-foam: #ffffff;
            --bg-gradient: linear-gradient(135deg, #0a2f49 0%, #1c5d7d 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--white-foam);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        /* Pastille de coefficient (cercle) */
        .coeff-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--sand-beige);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--sand-beige);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #location-header { margin-bottom: 1.5rem; padding-right: 40px; }

        #city-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--white-foam);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #current-date {
            font-size: 0.95rem;
            color: var(--sand-beige);
            opacity: 0.9;
        }

        .tide-status-wrapper { margin: 1.5rem 0; }

        .tide-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
            display: block;
        }

        #tide-status-text {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            transition: color 0.5s ease;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .status-montant { color: var(--ocean-teal); }
        .status-descendant { color: var(--coral-red); }

        .countdown-box {
            background: rgba(10, 47, 73, 0.5);
            padding: 1.2rem;
            border-radius: 15px;
            margin-top: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-title {
            font-size: 0.9rem;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
        }

        #next-tide-time {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--white-foam);
            margin-bottom: 0.5rem;
        }

        #countdown-timer {
            font-size: 2.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--white-foam);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--ocean-teal);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cercle du coefficient -->
        <div id="coeff-badge" class="coeff-badge">--</div>

        <div id="location-header">
            <div id="city-name">Localisation...</div>
            <div id="current-date"></div>
        </div>

        <div id="loader-container">
            <div class="loader"></div>
            <p style="color: var(--sand-beige);">Chargement des marées...</p>
        </div>

        <div id="main-content" style="display: none;">
            <div class="tide-status-wrapper">
                <span class="tide-label">La mer est actuellement</span>
                <div id="tide-status-text">--</div>
            </div>

            <div class="countdown-box">
                <div class="countdown-title" id="countdown-label">--</div>
                <div id="next-tide-time">À --:--</div>
                <div id="countdown-timer">--:--</div>
            </div>
        </div>
    </div>

    <script>
        const cityEl = document.getElementById('city-name');
        const dateEl = document.getElementById('current-date');
        const loaderEl = document.getElementById('loader-container');
        const mainContentEl = document.getElementById('main-content');
        const statusTextEl = document.getElementById('tide-status-text');
        const countdownLabelEl = document.getElementById('countdown-label');
        const nextTideTimeEl = document.getElementById('next-tide-time');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const coeffBadgeEl = document.getElementById('coeff-badge');

        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(positionSuccess, () => lancerApplication("Zone Côtière"), { enableHighAccuracy: true });
        } else {
            lancerApplication("Zone Côtière");
        }

        async function positionSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`);
                const data = await response.json();
                let ville = data.address?.city || data.address?.town || data.address?.village || data.address?.municipality || "Zone Côtière";
                lancerApplication(ville);
            } catch (e) {
                lancerApplication("Zone Côtière");
            }
        }

        function lancerApplication(ville) {
            cityEl.textContent = ville;
            loaderEl.style.display = 'none';
            mainContentEl.style.display = 'block';

            calculerMarees();
            setInterval(calculerMarees, 1000);
        }

        function calculerMarees() {
            const maintenant = new Date();
            const totalSecondesJour = maintenant.getHours() * 3600 + maintenant.getMinutes() * 60 + maintenant.getSeconds();

            // Exemple de marées étalons de la journée (ex: Roscoff / adaptable)
            // Pleine mer à 02h53, Basse mer à 15h08, etc. Converties en secondes :
            const h = (h, m) => h * 3600 + m * 60;

            const planningMarees = [
                { type: 'BM', heureSec: h(2, 53), heureStr: "02h53", coeff: 45 },
                { type: 'PM', heureSec: h(8, 50), heureStr: "08h50", coeff: 101 },
                { type: 'BM', heureSec: h(15, 8), heureStr: "15h08", coeff: 52 },
                { type: 'PM', heureSec: h(21, 1), heureStr: "21h01", coeff: 98 },
                { type: 'BM_NEXT', heureSec: h(27, 31), heureStr: "03h31 (+1j)", coeff: 48 }
            ];

            let prochaineMarée = planningMarees[0];
            let estMontante = false;

            if (totalSecondesJour < planningMarees[0].heureSec) {
                estMontante = true;
                prochaineMarée = planningMarees[0];
            } else if (totalSecondesJour >= planningMarees[0].heureSec && totalSecondesJour < planningMarees[1].heureSec) {
                estMontante = true; // De BM à PM -> La mer monte
                prochaineMarée = planningMarees[1];
            } else if (totalSecondesJour >= planningMarees[1].heureSec && totalSecondesJour < planningMarees[2].heureSec) {
                estMontante = false; // De PM à BM -> La mer descend
                prochaineMarée = planningMarees[2];
            } else if (totalSecondesJour >= planningMarees[2].heureSec && totalSecondesJour < planningMarees[3].heureSec) {
                estMontante = true; // De BM à PM -> La mer monte
                prochaineMarée = planningMarees[3];
            } else {
                estMontante = false; // Après la dernière PM -> La mer descend
                prochaineMarée = planningMarees[4];
            }

            let secondesRestantes = prochaineMarée.heureSec - totalSecondesJour;
            if (secondesRestantes < 0) secondesRestantes = 0;

            // Mise à jour interface
            coeffBadgeEl.textContent = prochaineMarée.coeff;

            if (estMontante) {
                statusTextEl.textContent = "LA MER MONTE";
                statusTextEl.className = 'status-montant';
                countdownLabelEl.textContent = "Pleine mer prévue :";
            } else {
                statusTextEl.textContent = "LA MER DESCEND";
                statusTextEl.className = 'status-descendant';
                countdownLabelEl.textContent = "Basse mer prévue :";
            }

            nextTideTimeEl.textContent = `à ${prochaineMarée.heureStr}`;

            const th = Math.floor(secondesRestantes / 3600);
            const tm = Math.floor((secondesRestantes % 3600) / 60);
            const ts = secondesRestantes % 60;

            countdownTimerEl.textContent = `${pad(th)}h ${pad(tm)}m ${pad(ts)}s`;
        }

        function pad(num) { return num.toString().padStart(2, '0'); }
    </script>
</body>
</html>
