<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marée en Direct - Universel</title>
    <style>
        :root {
            --deep-sea-blue: #0a2f49;
            --ocean-teal: #17a2b8;
            --sand-beige: #f3e5ab;
            --coral-red: #ff6b6b;
            --white-foam: #ffffff;
            --bg-gradient: linear-gradient(135deg, #0a2f49 0%, #1c5d7d 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--white-foam);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        .coeff-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--sand-beige);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--sand-beige);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #location-header { margin-bottom: 1.5rem; padding-right: 40px; }

        .city-select-wrapper {
            margin-top: 0.3rem;
        }

        #port-selector {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--sand-beige);
            color: var(--sand-beige);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
            max-width: 100%;
            text-overflow: ellipsis;
        }

        #port-selector option {
            background: var(--deep-sea-blue);
            color: var(--white-foam);
        }

        #current-date {
            font-size: 0.9rem;
            color: var(--sand-beige);
            opacity: 0.9;
            margin-top: 0.5rem;
        }

        .tide-status-wrapper { margin: 1.5rem 0; }

        .tide-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
            display: block;
        }

        #tide-status-text {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            transition: color 0.5s ease;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .status-montant { color: var(--ocean-teal); }
        .status-descendant { color: var(--coral-red); }

        .countdown-box {
            background: rgba(10, 47, 73, 0.5);
            padding: 1.2rem;
            border-radius: 15px;
            margin-top: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-title {
            font-size: 0.9rem;
            color: var(--sand-beige);
            margin-bottom: 0.3rem;
        }

        #next-tide-time {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--white-foam);
            margin-bottom: 0.5rem;
        }

        #countdown-timer {
            font-size: 2.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--white-foam);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--ocean-teal);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="coeff-badge" class="coeff-badge">--</div>

        <div id="location-header">
            <div class="city-select-wrapper">
                <select id="port-selector" onchange="changerDePortManette(this.value)">
                    <!-- Options injectées dynamiquement -->
                </select>
            </div>
            <div id="current-date"></div>
        </div>

        <div id="loader-container">
            <div class="loader"></div>
            <p style="color: var(--sand-beige);">Recherche de votre position...</p>
        </div>

        <div id="main-content" style="display: none;">
            <div class="tide-status-wrapper">
                <span class="tide-label">La mer est actuellement</span>
                <div id="tide-status-text">--</div>
            </div>

            <div class="countdown-box">
                <div class="countdown-title" id="countdown-label">--</div>
                <div id="next-tide-time">À --:--</div>
                <div id="countdown-timer">--:--</div>
            </div>
        </div>
    </div>

    <script>
        const dateEl = document.getElementById('current-date');
        const loaderEl = document.getElementById('loader-container');
        const mainContentEl = document.getElementById('main-content');
        const statusTextEl = document.getElementById('tide-status-text');
        const countdownLabelEl = document.getElementById('countdown-label');
        const nextTideTimeEl = document.getElementById('next-tide-time');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const coeffBadgeEl = document.getElementById('coeff-badge');
        const portSelector = document.getElementById('port-selector');

        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Base de référence des principaux ports de France métropolitaine (avec coordonnées GPS et horaires type du jour)
        const PortsFrance = [
            { id: "roscoff", nom: "Roscoff", lat: 48.72, lon: -3.98, marees: [{t:'BM',h:3,m:31,c:95},{t:'PM',h:9,m:25,c:95},{t:'BM',h:15,m:45,c:90},{t:'PM',h:21,m:35,c:90}] },
            { id: "st-malo", nom: "Saint-Malo", lat: 48.64, lon: -2.02, marees: [{t:'BM',h:4,m:5,c:96},{t:'PM',h:9,m:58,c:96},{t:'BM',h:16,m:20,c:91},{t:'PM',h:22,m:10,c:91}] },
            { id: "brest", nom: "Brest", lat: 48.39, lon: -4.48, marees: [{t:'BM',h:3,m:45,c:94},{t:'PM',h:9,m:38,c:94},{t:'BM',h:16,m:0,c:89},{t:'PM',h:21,m:50,c:89}] },
            { id: "cherbourg", nom: "Cherbourg", lat: 49.63, lon: -1.62, marees: [{t:'BM',h:5,m:10,c:85},{t:'PM',h:11,m:15,c:85},{t:'BM',h:17,m:30,c:80},{t:'PM',h:23,m:25,c:80}] },
            { id: "le-havre", nom: "Le Havre", lat: 49.49, lon: 0.10, marees: [{t:'BM',h:5,m:30,c:88},{t:'PM',h:11,m:40,c:88},{t:'BM',h:17,m:50,c:83},{t:'PM',h:23,m:55,c:83}] },
            { id: "bordeaux", nom: "Bordeaux", lat: 44.83, lon: -0.57, marees: [{t:'BM',h:6,m:15,c:75},{t:'PM',h:12,m:30,c:75},{t:'BM',h:18,m:40,c:72},{t:'PM',h:23,m:50,c:72}] },
            { id: "marseille", nom: "Marseille (Méditerranée)", lat: 43.29, lon: 5.36, marees: [{t:'BM',h:6,m:0,c:20},{t:'PM',h:12,m:0,c:20},{t:'BM',h:18,m:0,c:20},{t:'PM',h:23,m:59,c:20}] },
            { id: "la-rochelle", nom: "La Rochelle", lat: 46.16, lon: -1.15, marees: [{t:'BM',h:4,m:20,c:90},{t:'PM',h:10,m:10,c:90},{t:'BM',h:16,m:45,c:86},{t:'PM',h:22,m:30,c:86}] }
        ];

        let portActuel = PortsFrance[0];
        let intervalId = null;

        function initialiserSelecteur(portSelectionneId) {
            portSelector.innerHTML = "";
            PortsFrance.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.nom;
                if (p.id === portSelectionneId) opt.selected = true;
                portSelector.appendChild(opt);
            });
        }

        // Étape 1 : Géolocalisation automatique au démarrage
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(positionSuccess, () => fixerPortDefaut(PortsFrance[0]), { enableHighAccuracy: true });
        } else {
            fixerPortDefaut(PortsFrance[0]);
        }

        function positionSuccess(position) {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            // Trouver le port le plus proche via un calcul de distance GPS simple
            let portProche = PortsFrance[0];
            let minDistance = Infinity;

            PortsFrance.forEach(p => {
                const dist = Math.sqrt(Math.pow(p.lat - userLat, 2) + Math.pow(p.lon - userLon, 2));
                if (dist < minDistance) {
                    minDistance = dist;
                    portProche = p;
                }
            });

            fixerPortDefaut(portProche);
        }

        function fixerPortDefaut(portObj) {
            portActuel = portObj;
            initialiserSelecteur(portObj.id);
            loaderEl.style.display = 'none';
            mainContentEl.style.display = 'block';

            lancerBoucleMarée();
        }

        function changerDePortManette(idPort) {
            const trouve = PortsFrance.find(p => p.id === idPort);
            if (trouve) {
                portActuel = trouve;
                lancerBoucleMarée();
            }
        }

        function lancerBoucleMarée() {
            if (intervalId) clearInterval(intervalId);
            calculerMareeTempsReel();
            intervalId = setInterval(calculerMareeTempsReel, 1000);
        }

        function calculerMareeTempsReel() {
            const dateActuelle = new Date();
            const mareesDuJour = portActuel.marees;
            const secondesActuelles = dateActuelle.getHours() * 3600 + dateActuelle.getMinutes() * 60 + dateActuelle.getSeconds();

            let prochaine = null;
            let estMontante = false;

            for (let i = 0; i < mareesDuJour.length; i++) {
                const eventSec = mareesDuJour[i].h * 3600 + mareesDuJour[i].m * 60;
                if (secondesActuelles < eventSec) {
                    prochaine = mareesDuJour[i];
                    prochaine.eventSec = eventSec;
                    break;
                }
            }

            if (!prochaine) {
                prochaine = { t: 'BM', h: 4, m: 0, c: portActuel.marees[0].c, eventSec: 24 * 3600 + 4 * 3600 };
            }

            estMontante = (prochaine.t === 'PM');
            let secondesRestantes = prochaine.eventSec - secondesActuelles;
            if (secondesRestantes < 0) secondesRestantes = 0;

            coeffBadgeEl.textContent = prochaine.c;

            if (estMontante) {
                statusTextEl.textContent = "LA MER MONTE";
                statusTextEl.className = 'status-montant';
                countdownLabelEl.textContent = "Pleine mer prévue :";
            } else {
                statusTextEl.textContent = "LA MER DESCEND";
                statusTextEl.className = 'status-descendant';
                countdownLabelEl.textContent = "Basse mer prévue :";
            }

            nextTideTimeEl.textContent = `à ${pad(prochaine.h)}h${pad(prochaine.m)}`;

            const th = Math.floor(secondesRestantes / 3600);
            const tm = Math.floor((secondesRestantes % 3600) / 60);
            const ts = secondesRestantes % 60;

            countdownTimerEl.textContent = `${pad(th)}h ${pad(tm)}m ${pad(ts)}s`;
        }

        function pad(num) { return String(num).padStart(2, '0'); }
    </script>
</body>
</html>
