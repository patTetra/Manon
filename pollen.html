<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Breizh - Indices Polliniques</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #map { height: 400px; width: 100%; border-radius: 0.75rem; z-index: 1; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-leaf text-2xl text-emerald-200"></i>
                <h1 class="text-xl font-bold">Air Breizh - Surveillance Pollens</h1>
            </div>
            <span id="status-badge" class="px-3 py-1 bg-emerald-800 text-xs rounded-full flex items-center gap-2">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-400"></span>
                <span id="status-text">Connexion à Air Breizh...</span>
            </span>
        </div>
    </header>

    <!-- App Main -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Colonne Gauche : Sélection & Détails -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Sélecteur -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <label for="zone-select" class="block text-sm font-semibold mb-2 text-slate-700">
                    <i class="fa-solid fa-location-dot text-emerald-600 mr-1"></i> Choisir une zone / EPCI :
                </label>
                <div class="flex gap-2">
                    <select id="zone-select" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Chargement des zones Air Breizh...</option>
                    </select>
                    <button id="btn-geoloc" title="Me géolocaliser" class="px-3 py-2 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-lg">
                        <i class="fa-solid fa-crosshairs"></i>
                    </button>
                </div>
            </div>

            <!-- Résumé Zone -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h2 id="zone-name" class="text-lg font-bold text-slate-800">--</h2>
                        <p id="zone-date" class="text-xs text-slate-500">Mise à jour : --</p>
                    </div>
                    <span id="global-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-slate-100 text-slate-600">--</span>
                </div>
                <div class="mt-3 bg-slate-50 p-3 rounded-lg flex justify-between items-center border border-slate-100">
                    <span class="text-sm font-medium text-slate-600">Indice Global</span>
                    <span id="global-score" class="text-sm font-bold text-slate-800">-- / 6</span>
                </div>
            </div>

            <!-- Liste des plantes -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex-1">
                <h3 class="text-sm font-bold mb-3 text-slate-700 flex justify-between items-center">
                    <span><i class="fa-solid fa-seedling text-emerald-600 mr-2"></i>Indices par plante</span>
                    <span class="text-xs font-normal text-slate-400">Échelle 1 à 6</span>
                </h3>
                <div id="taxons-list" class="space-y-2 max-h-[350px] overflow-y-auto pr-1">
                    <p class="text-xs text-slate-400 text-center py-6">Sélectionnez une zone pour afficher les taxons.</p>
                </div>
            </div>

        </div>

        <!-- Colonne Droite : Carte -->
        <div class="lg:col-span-7 flex flex-col gap-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-semibold mb-3 text-slate-700">Carte Bretagne</h3>
                <div id="map"></div>
            </div>

            <!-- Légende -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Échelle de risque</h4>
                <div class="grid grid-cols-6 gap-1 text-center text-xs font-semibold">
                    <div class="p-1.5 rounded bg-emerald-100 text-emerald-800">1 Nul</div>
                    <div class="p-1.5 rounded bg-lime-100 text-lime-800">2 Très faible</div>
                    <div class="p-1.5 rounded bg-yellow-100 text-yellow-800">3 Faible</div>
                    <div class="p-1.5 rounded bg-orange-100 text-orange-800">4 Moyen</div>
                    <div class="p-1.5 rounded bg-red-100 text-red-800">5 Élevé</div>
                    <div class="p-1.5 rounded bg-purple-100 text-purple-800">6 Très élevé</div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const WFS_URL = "https://datacarto.airbreizh.asso.fr/wfs/4cd6a965-2230-45f8-9b9f-1a9da9145fba?service=WFS&version=2.0.0&request=GetFeature&typeNames=ind_bretagne_pollen&outputFormat=application/json";
        
        const PROXIES = [
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        const TAXONS = [
            { key: 'code_graminees', name: 'Graminées', icon: 'fa-wheat-awn' },
            { key: 'code_bouleau', name: 'Bouleau', icon: 'fa-tree' },
            { key: 'code_ambroisie', name: 'Ambroisie', icon: 'fa-plant-wilt' },
            { key: 'code_aulne', name: 'Aulne', icon: 'fa-tree' },
            { key: 'code_frene', name: 'Frêne', icon: 'fa-tree' },
            { key: 'code_chene', name: 'Chêne', icon: 'fa-tree' },
            { key: 'code_noisetier', name: 'Noisetier', icon: 'fa-tree' },
            { key: 'code_saule', name: 'Saule', icon: 'fa-tree' },
            { key: 'code_armoise', name: 'Armoise', icon: 'fa-seedling' }
        ];

        const LEVELS = {
            1: { label: 'Nul', color: '#10b981', bg: 'bg-emerald-100', text: 'text-emerald-800' },
            2: { label: 'Très faible', color: '#84cc16', bg: 'bg-lime-100', text: 'text-lime-800' },
            3: { label: 'Faible', color: '#eab308', bg: 'bg-yellow-100', text: 'text-yellow-800' },
            4: { label: 'Moyen', color: '#f97316', bg: 'bg-orange-100', text: 'text-orange-800' },
            5: { label: 'Élevé', color: '#ef4444', bg: 'bg-red-100', text: 'text-red-800' },
            6: { label: 'Très élevé', color: '#a855f7', bg: 'bg-purple-100', text: 'text-purple-800' }
        };

        let map, featuresData = [];

        function initMap() {
            map = L.map('map').setView([48.1, -2.9], 8);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap / Air Breizh'
            }).addTo(map);
        }

        async function fetchData() {
            // Essai direct
            try {
                let res = await fetch(WFS_URL);
                if (res.ok) return await res.json();
            } catch (e) {}

            // Essais via proxys CORS
            for (let proxyFn of PROXIES) {
                try {
                    let res = await fetch(proxyFn(WFS_URL));
                    if (res.ok) return await res.json();
                } catch (e) {}
            }

            throw new Error("Impossible d'accéder au serveur WFS Air Breizh (CORS/Réseau).");
        }

        async function startApp() {
            initMap();
            try {
                const data = await fetchData();
                featuresData = data.features || [];
                
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-400";
                document.getElementById('status-text').textContent = "Connecté à Air Breizh";
                
                populateSelect();
                renderMapFeatures(data);

                if (featuresData.length > 0) {
                    selectZone(0);
                }
            } catch (err) {
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-red-500";
                document.getElementById('status-text').textContent = "Erreur Flux WFS";
                document.getElementById('zone-name').textContent = "Serveur Air Breizh Inaccessible";
                document.getElementById('zone-select').innerHTML = `<option>Flux WFS bloqué par le navigateur (CORS)</option>`;
            }
        }

        function populateSelect() {
            const select = document.getElementById('zone-select');
            select.innerHTML = '<option value="">-- Sélectionnez une zone --</option>';

            featuresData.forEach((feat, i) => {
                const name = feat.properties.lib_zone || feat.properties.nom_zone || `Zone ${i+1}`;
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = name;
                select.appendChild(opt);
            });

            select.addEventListener('change', (e) => {
                if (e.target.value !== "") selectZone(parseInt(e.target.value));
            });
        }

        function renderMapFeatures(geojson) {
            L.geoJSON(geojson, {
                pointToLayer: (feature, latlng) => {
                    const qual = feature.properties.code_qual || 1;
                    const lvl = LEVELS[qual] || LEVELS[1];
                    return L.circleMarker(latlng, {
                        radius: 10,
                        fillColor: lvl.color,
                        color: "#fff",
                        weight: 2,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: (feature, layer) => {
                    const name = feature.properties.lib_zone || feature.properties.nom_zone || "Zone";
                    layer.bindTooltip(name);
                    layer.on('click', () => {
                        const idx = featuresData.indexOf(feature);
                        if (idx !== -1) {
                            document.getElementById('zone-select').value = idx;
                            selectZone(idx);
                        }
                    });
                }
            }).addTo(map);
        }

        function selectZone(index) {
            const feat = featuresData[index];
            if (!feat) return;

            const props = feat.properties;
            document.getElementById('zone-name').textContent = props.lib_zone || props.nom_zone || "Zone";
            document.getElementById('zone-date').textContent = "Échéance : " + (props.date_ech || "En cours");

            const qual = props.code_qual || 1;
            const lvl = LEVELS[qual] || LEVELS[1];

            const badge = document.getElementById('global-badge');
            badge.textContent = lvl.label;
            badge.className = `px-3 py-1 text-xs font-bold rounded-full ${lvl.bg} ${lvl.text}`;

            document.getElementById('global-score').textContent = `${qual} / 6`;

            // Taxons
            const listContainer = document.getElementById('taxons-list');
            listContainer.innerHTML = '';

            TAXONS.forEach(t => {
                const val = props[t.key];
                if (val !== undefined && val !== null) {
                    const tLvl = LEVELS[val] || LEVELS[1];
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-2.5 rounded-lg border border-slate-100 bg-slate-50";
                    div.innerHTML = `
                        <div class="flex items-center gap-2">
                            <i class="fa-solid ${t.icon} text-slate-500 w-5 text-center"></i>
                            <span class="text-xs font-semibold text-slate-700">${t.name}</span>
                        </div>
                        <span class="px-2 py-0.5 text-xs font-bold rounded ${tLvl.bg} ${tLvl.text}">
                            ${val}/6 - ${tLvl.label}
                        </span>
                    `;
                    listContainer.appendChild(div);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', startApp);
    </script>
</body>
</html>
